[project]
name = "pubtrack"
version = "0.1.0"
description = "Приложение для учёта научных публикаций"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "openpyxl>=3.1.5",
    "pyinstaller>=6.22.3",
    "pyside6>=6.11.2",
    "pyside6-fluent-widgets>=1.11.3",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
markers = ["us_01(criteria): тест относится к критерию приёмки из User Story US-01"]
